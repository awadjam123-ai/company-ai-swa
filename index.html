<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company AI - Day 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Ask the Assistant</h1>

    <div class="row">
      <input id="q" placeholder="Type your question..." />
      <button id="ask">Ask</button>
    </div>

    <pre id="a" class="answer"></pre>
  </main>

  <script>
    const input = document.getElementById('q');
    const btn   = document.getElementById('ask');
    const out   = document.getElementById('a');

    function setLoading(b) {
      btn.disabled  = b;
      btn.textContent = b ? 'Asking…' : 'Ask';
    }

    function show(msg) {
      out.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
    }

    async function ask() {
      const prompt = input.value.trim();
      if (!prompt) return;

      setLoading(true);
      show('Thinking…');

      try {
        const res = await fetch('/api/llm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        console.log('POST /api/llm → status', res.status);

        // Only parse JSON if the server says so
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (!ct.includes('application/json')) {
          const txt = await res.text().catch(() => '');
          throw new Error(`Non-JSON response (status ${res.status}): ${txt.slice(0, 800)}…`);
        }

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }

        show(data?.answer || '(no answer)');
      } catch (e) {
        console.error(e);
        show('Error: ' + (e?.message || String(e)));
      } finally {
        setLoading(false);
      }
    }

    btn.addEventListener('click', ask);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
  </script>
</body>
</html>
