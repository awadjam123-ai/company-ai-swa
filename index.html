<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company AI - Day 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Ask the Assistant</h1>

    <div class="row">
      <label for="q" class="sr-only">Question</label>
      <input id="q" placeholder="Type your question..." autocomplete="off" />
      <button id="ask" aria-label="Ask the assistant">Ask</button>
    </div>

    <div id="status" class="sr-only" aria-live="polite"></div>
    <pre id="a" class="answer" tabindex="-1" aria-live="polite"></pre>
  </main>

  <script>
    (function(){
      const input  = document.getElementById('q');
      const button = document.getElementById('ask');
      const out    = document.getElementById('a');
      const status = document.getElementById('status');

      function setLoading(b) {
        button.disabled = b;
        input.disabled  = b;
        button.textContent = b ? 'Asking…' : 'Ask';
        button.setAttribute('aria-busy', String(b));
        status.textContent = b ? 'Sending your question…' : '';
      }

      function show(msg, focus=false) {
        out.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
        if (focus) out.focus();
      }

      async function ask() {
        const prompt = (input.value || '').trim();
        if (!prompt) return;

        setLoading(true);
        show('Thinking…');

        try {
          const res = await fetch('/api/llm', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'accept': 'application/json'
            },
            body: JSON.stringify({ prompt })
          });

          const ct = (res.headers.get('content-type') || '').toLowerCase();
          if (!ct.includes('application/json')) {
            const txt = await res.text().catch(() => '');
            throw new Error(`Non-JSON response (status ${res.status}): ${txt.slice(0, 500)}…`);
          }

          const data = await res.json();
          if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);

          show(data?.answer ?? '(no answer)', true);
        } catch (e) {
          show('Error: ' + (e?.message || String(e)), true);
        } finally {
          setLoading(false);
        }
      }

      button.addEventListener('click', ask);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
    })();
  </script>
</body>
</html>
