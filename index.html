<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company AI - Day 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Ask the Assistant</h1>

    <div class="row">
      <input id="q" placeholder="Type your question..." />
      <button id="ask">Ask</button>
    </div>

    <pre id="a" class="answer"></pre>
  </main>

  <script>
    document.getElementById('ask').addEventListener('click', async () => {
      const prompt = document.getElementById('q').value.trim();
      if (!prompt) return;

      const res = await fetch('/api/llm', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();
      document.getElementById('a').textContent = data.answer || data.error || "(no answer)";
    });
  <script>
  const input = document.getElementById('q');
  const btn = document.getElementById('ask');
  const out = document.getElementById('a');

  function setLoading(b) {
    btn.disabled = b;
    btn.textContent = b ? 'Asking…' : 'Ask';
  }

  async function ask() {
    const prompt = input.value.trim();
    if (!prompt) return;

    setLoading(true);
    out.textContent = 'Thinking…';
    console.log('POST /api/llm', { prompt });

    try {
      const res = await fetch('/api/llm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      console.log('Status:', res.status);

      let data;
      try {
        data = await res.json();
      } catch {
        const txt = await res.text();
        throw new Error(`Non-JSON response (status ${res.status}): ${txt.slice(0,200)}…`);
      }

      if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
      out.textContent = data.answer || '(no answer)';
    } catch (e) {
      console.error(e);
      out.textContent = `Error: ${e.message}`;
    } finally {
      setLoading(false);
    }
  }

  btn.addEventListener('click', ask);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
