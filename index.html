<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company AI - Day 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Ask the Assistant</h1>

    <div class="row">
      <label for="q" class="sr-only">Question</label>
      <input id="q" placeholder="Type your question..." autocomplete="off" />
      <button id="ask" aria-label="Ask the assistant">Ask</button>
    </div>

    <!-- Live region for screen readers -->
    <div id="status" class="sr-only" aria-live="polite"></div>

    <pre id="a" class="answer" tabindex="-1" aria-live="polite"></pre>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
